name: Tägliches Aktien-Radar

on:
  schedule:
    # Yahoo schliesst die Tagesdaten der US-Boersen erst ca. 6 Stunden nach Handelsschluss ab (ab ca. 02:00 UTC).
    # Frueher gestartete Laeufe (22:47/00:23 UTC im Oktober 2026) bekamen leere Kurse. GitHub startet geplante Laeufe
    # zudem mit Verspaetung. Darum mehrere Versuche zwischen 02:23 und 07:17 UTC (ungerade Minuten); der Vorab-Check
    # (tools/guard.py) ueberspringt alle weiteren, sobald die Daten des letzten Handelstags vorliegen.
    # = 04:23 bis 09:17 Uhr Sommerzeit (eine Stunde frueher im Winter), Dienstag bis Samstag.
    - cron: "23 2 * * 2-6"
    - cron: "47 3 * * 2-6"
    - cron: "43 4 * * 2-6"
    - cron: "43 5 * * 2-6"
    - cron: "17 7 * * 2-6"
  workflow_dispatch: {}
  push:
    # Testlauf nach Aenderungen am Programm (Ergebnis-Dateien in data/ und docs/ loesen keinen Lauf aus)
    paths:
      - "radar/**"
      - "run_daily.py"
      - ".github/workflows/daily.yml"
      - "tools/**"
      - "beobachtung.txt"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Daten schon aktuell?
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(python3 tools/guard.py)" = "True" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daten sind schon auf dem Stand des letzten Handelstags, dieser Versuch wird übersprungen."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - name: Radar berechnen und Seite bauen
        id: radar
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: |
          set -o pipefail
          python -u run_daily.py 2>&1 | tee run.log
      - name: Ergebnis und Protokoll speichern
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          cp run.log data/last_run.log 2>/dev/null || true
          git config user.name "aktien-radar-bot"
          git config user.email "aktien-radar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Tageslauf $(date -u +%F) (${{ steps.radar.outcome }})" && git pull --rebase -q && git push)
      - name: Fehlschlag melden
        if: steps.radar.outcome == 'failure'
        run: exit 1

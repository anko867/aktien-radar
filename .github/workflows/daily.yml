name: Tägliches Aktien-Radar

on:
  schedule:
    # 05:00 UTC = 07:00 Uhr Sommerzeit / 06:00 Uhr Winterzeit in Deutschland; Dienstag bis Samstag
    # (dann liegen die Schlusskurse vom Vortag vor). GitHub startet geplante Läufe teils mit Verspätung.
    - cron: "0 5 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar berechnen und Seite bauen
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python run_daily.py
      - name: Ergebnis speichern (Verlauf, Bilanz, Seite)
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "aktien-radar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Tageslauf $(date -u +%F)" && git push)

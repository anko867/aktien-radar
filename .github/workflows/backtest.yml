name: Wöchentlicher Backtest

on:
  schedule:
    - cron: "0 3 * * 0"   # sonntags 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_backtest.py
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "aktien-radar-bot@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet || (git commit -m "Backtest $(date -u +%F)" && git push)
